[[redirects]]
from = "^/documents/SMWyatt_CV_2026_rev2\\.pdf$"
to = "/documents/smwyatt-cv.pdf"
permanent = true

[[headers]]
name = "Content-Security-Policy"
value = "script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com"

[[headers]]
name = "Content-Type"
value = "application/manifest+json"
on = "^/site\\.webmanifest$"

[[headers]]
name = "Cache-Control"
value = "public, max-age=31536000"
on = "\\.(?:css|js|webp|gif|svg|png|ico|pdf|woff2?)$"
